name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover tests -v
      # master must match its published OTA manifest exactly. Other
      # branches may be ahead of the release; drift is reported, not failed.
      - if: github.ref == 'refs/heads/master'
        run: python tools/verify_ota_manifest.py
      - if: github.ref != 'refs/heads/master'
        run: python tools/verify_ota_manifest.py --pending
      - run: python main.py --demo
      - run: python tools/preview.py preview
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-preview
          path: preview/
