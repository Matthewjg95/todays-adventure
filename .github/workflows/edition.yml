name: Daily Paper edition
# Builds edition.json from public feeds (tools/edition_sources.json) and
# publishes it as the only file on the `edition` branch. The Paper reads
# it from raw.githubusercontent.com at scheduled updates. Separate from
# master and OTA: this never changes firmware.
on:
  schedule:
    # Two editions a day. UTC; Eastern is UTC-4 in summer, UTC-5 in winter.
    - cron: '17 10 * * *'   # morning: ~6:17 AM EDT / 5:17 AM EST
    - cron: '17 21 * * *'   # evening: ~5:17 PM EDT / 4:17 PM EST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: edition
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31,<3'
      - name: Build the edition (Gemini pass only when switched on)
        env:
          # Off unless the repository variable GEMINI_EDITION is "on" AND the
          # secret GEMINI_API_KEY exists. See docs/AI_PIPELINES.md.
          GEMINI_EDITION: ${{ vars.GEMINI_EDITION }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          extra=""
          if [ "$GEMINI_EDITION" = "on" ] && [ -n "$GEMINI_API_KEY" ]; then extra="--gemini"; fi
          python tools/build_edition.py "$RUNNER_TEMP/edition.json" $extra
      - name: Publish to the edition branch (single commit, replaced each run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          cp "$RUNNER_TEMP/edition.json" edition.json
          printf 'Generated by .github/workflows/edition.yml. Data only; replaced on every run.\n' > README.md
          git init -q -b edition
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edition.json README.md
          git commit -q -m "Daily Paper edition $(date -u +%Y-%m-%dT%H%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" edition:edition
